<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" class="no-js">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.remove('no-js')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{site}}{{path}}">
  {{hreflang}}
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Arzano">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{site}}{{path}}">
  <meta property="og:image" content="{{site}}assets/img/r/{{og_image}}.jpg">
  <meta property="og:locale" content="{{og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="{{root}}site.webmanifest">
  {{preload}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500{{fonts_extra}}&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
  {{jsonld}}
</head>
